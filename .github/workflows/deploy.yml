# 部署。建置在這裡跑完（含預先渲染 474 個路由），再把成品送上 Vercel。
#
# 為什麼不讓 Vercel 自己建：它的建置環境沒有 libnspr4，Chromium 起不來，於是
# 2026-07-28 之前每一次部署送上線的都是空殼。這裡的 runner 我們裝得動瀏覽器，
# `playwright install --with-deps` 一步就把系統相依補齊。
#
# 需要三個 repo secret：VERCEL_TOKEN、VERCEL_ORG_ID、VERCEL_PROJECT_ID。
# 設定方式寫在 HANDOFF.md 的「部署」節。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Chromium 本體每次重抓 20 秒上下，而它只隨 playwright 版本變，所以快取它。
      # 快取沒中就照樣下載，行為不變。key 綁 package-lock，升 playwright 自動換一份新的。
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 瀏覽器與系統相依一起裝。少了 --with-deps 就是線上那個故障的成因。
      # 上一步命中時這裡只補系統相依（apt 那段不能快取，但只有幾秒）。
      - run: npx playwright install --with-deps chromium

      # 這一步要 17 秒。試過改成 devDependency 讓 `npm ci` 順便裝（2026-07-29），但
      # `npm install --save-dev --package-lock-only vercel` 會把整份 package-lock 重新
      # 解析——一萬六千行變動、間接相依跟著漂——為了 17 秒不划算，維持全域安裝。
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel 專案裡那兩個瀏覽器端變數被標成 sensitive，於是 `vercel pull` 只還回字面上的
      # "[REDACTED]"（sensitive 的設計就是誰都讀不回來，連 API 帶 decrypt=true 也一樣）。
      # 建置跑在 Vercel 自己機器上時真值是當場注入的，搬到 Actions 之後就變成把 "[REDACTED]"
      # 烤進 bundle：`configured` 判定為真、supabase-js 拿它當網址，線上每頁 console 都丟
      # 「Invalid supabaseUrl」，登入是壞的（2026-07-28 發現）。
      # 這一步用 GitHub secrets 覆寫那兩行。兩個值都是公開的瀏覽器端值（每個訪客的 bundle
      # 裡都有），放 secrets 只是為了不寫進這個公開 repo。secret 沒設就原樣留著，交給下面的
      # 閘門擋下來。
      - name: Restore the client-side Supabase env that `vercel pull` redacts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          file=.vercel/.env.production.local
          test -f "$file" || { echo "找不到 $file，vercel pull 沒跑成功"; exit 1; }
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::沒有設 VITE_SUPABASE_* 這兩個 GitHub secret，登入功能會是壞的"
            exit 0
          fi
          grep -v '^VITE_SUPABASE_' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          printf 'VITE_SUPABASE_URL="%s"\n' "$VITE_SUPABASE_URL" >> "$file"
          printf 'VITE_SUPABASE_PUBLISHABLE_KEY="%s"\n' "$VITE_SUPABASE_PUBLISHABLE_KEY" >> "$file"
          echo "已覆寫兩個變數（值不印出來）"

      # 這一步會執行 package.json 的 build，也就是 verify:policy → vite build →
      # prerender → validate:prerender → sitemap。任何一關沒過就紅在這裡。
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # 遮蔽字串不准上線。這種故障不會讓建置失敗、也不會讓頁面變空，只會在每個訪客的
      # console 裡丟一句錯誤、讓登入不能用，所以要有一道檢查專門偵測它。
      - name: Assert no redacted placeholder was baked into the bundle
        run: |
          if grep -rl '\[REDACTED\]' .vercel/output/static/assets/ >/dev/null 2>&1; then
            echo '建置產物裡有 "[REDACTED]"：某個 sensitive 環境變數沒有被真值覆寫。'
            echo '補法：在 GitHub secrets 設 VITE_SUPABASE_URL 與 VITE_SUPABASE_PUBLISHABLE_KEY，'
            echo '或把 Vercel 專案裡那兩個變數改成非 sensitive，讓 vercel pull 拿得到真值。'
            exit 1
          fi
          echo "產物裡沒有遮蔽字串"

      # 再確認一次「要送上去的那份」不是空殼——上一步查的是 dist/，這一步查的是
      # Vercel 實際會拿去部署的目錄。兩者理論上同源，但這是最後一道，很便宜。
      - name: Assert the artifact is not an empty shell
        run: |
          file=.vercel/output/static/index.html
          test -f "$file" || { echo "找不到 $file"; exit 1; }
          if grep -q '<div id="root"></div>' "$file"; then
            echo "$file 的根節點是空的，預先渲染沒有生效"; exit 1
          fi
          echo "$file: $(wc -c < "$file") bytes"

      # --archive=tgz：整份產物打包成一個壓縮檔上傳，取代逐檔上傳。
      # 站上有五百多個預先渲染的頁，逐檔上傳等於一次部署就用掉五百多次上傳額度；
      # 免費方案是 24 小時 5000 次，2026-07-29 那天推得比較密集就爆掉了，錯誤長這樣：
      #   Error: Too many requests - try again in 24 hours (more than 5000, code: "api-upload-free")
      # 它出現在 Deploy 這一步，前面所有檢查都已經綠了，所以症狀是「建置全過但站沒更新」。
      - name: Deploy
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}

      # 上線之後才推，順序不能反——先推等於叫 Bing 去看還沒更新的頁。
      # 這一步失敗不影響部署結果，理由寫在 scripts/indexnow.mjs 開頭。
      - name: Tell IndexNow the site changed
        run: node scripts/indexnow.mjs
