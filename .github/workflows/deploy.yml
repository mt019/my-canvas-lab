# 部署。建置在這裡跑完（含預先渲染 474 個路由），再把成品送上 Vercel。
#
# 為什麼不讓 Vercel 自己建：它的建置環境沒有 libnspr4，Chromium 起不來，於是
# 2026-07-28 之前每一次部署送上線的都是空殼。這裡的 runner 我們裝得動瀏覽器，
# `playwright install --with-deps` 一步就把系統相依補齊。
#
# 需要四個 repo secret：VERCEL_TOKEN、VERCEL_ORG_ID、VERCEL_PROJECT_ID，
# 以及 NOTES_DATA_TOKEN（讀取私有的 mt019/notes-data，《手記》的內容不進這個公開 repo）。
# 設定方式寫在 HANDOFF.md 的「部署」節。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 《手記》的文章不在這個公開 repo 裡（理由與擋掉的路徑見 .gitignore）。它們住在私有的
      # mt019/notes-data，這一步把那個倉 clone 到 runner 的暫存目錄、跑它自己的 sync，把
      # notes.json、57 篇正文、存檔頁與匯入圖片放進工作區；建置完隨 runner 一起消失。
      # clone 到 $RUNNER_TEMP 而不是工作區底下，免得多出一個目錄被各支 validate 掃進去。
      # 私有倉那邊要進版控的是正文與產物（content/、data/、processed/、assets/imported/）。
      # 這裡跑 `npm run update`＝build ＋ sync：build 從 data/ 與 content/ 重算
      # processed/notes.json，所以就算私有倉那份產物忘了更新也不會送到舊的上線。
      # 存檔頁那兩個檔（processed/archive.*）例外，它們是 drafts/ 算出來的，而 drafts/ 隨時
      # 可以從 raw/ 重建、不進版控，所以存檔頁的產物要跟著 commit。
      - name: Bring in the notes content from its private repo
        env:
          NOTES_DATA_TOKEN: ${{ secrets.NOTES_DATA_TOKEN }}
        run: |
          test -n "$NOTES_DATA_TOKEN" || { echo "沒有設 NOTES_DATA_TOKEN，取不到《手記》的內容"; exit 1; }
          git clone --depth=1 "https://x-access-token:${NOTES_DATA_TOKEN}@github.com/mt019/notes-data.git" "$RUNNER_TEMP/notes-data"
          cd "$RUNNER_TEMP/notes-data"
          CANVAS_DIR="$GITHUB_WORKSPACE" npm run update

      # 上一步失敗的樣子是「站上整個 /notes 不見了」，而建置本身照樣會成功——預先渲染
      # 走的是路由表，少了資料只會少幾頁，不會報錯。這種「壞掉時仍然回傳合法值」的環節
      # 一律要驗產物內容，不驗流程有沒有跑完。
      - name: Assert the notes content actually arrived
        run: |
          test -f src/data/notes.json || { echo "src/data/notes.json 不存在"; exit 1; }
          n=$(node -p "require('./src/data/notes.json').posts.length")
          m=$(ls src/content/notes/*.mdx 2>/dev/null | wc -l | tr -d ' ')
          test -f src/content/notes-archive.mdx || { echo "存檔頁正文不存在"; exit 1; }
          echo "notes.json $n 篇、正文 $m 個檔、存檔頁在"
          if [ "$n" -lt 40 ] || [ "$n" != "$m" ]; then
            echo "篇數不對：至少要有 40 篇，而且 json 的篇數要等於正文檔數"; exit 1
          fi

      # 瀏覽器與系統相依一起裝。少了 --with-deps 就是線上那個故障的成因。
      - run: npx playwright install --with-deps chromium

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel 專案裡那兩個瀏覽器端變數被標成 sensitive，於是 `vercel pull` 只還回字面上的
      # "[REDACTED]"（sensitive 的設計就是誰都讀不回來，連 API 帶 decrypt=true 也一樣）。
      # 建置跑在 Vercel 自己機器上時真值是當場注入的，搬到 Actions 之後就變成把 "[REDACTED]"
      # 烤進 bundle：`configured` 判定為真、supabase-js 拿它當網址，線上每頁 console 都丟
      # 「Invalid supabaseUrl」，登入是壞的（2026-07-28 發現）。
      # 這一步用 GitHub secrets 覆寫那兩行。兩個值都是公開的瀏覽器端值（每個訪客的 bundle
      # 裡都有），放 secrets 只是為了不寫進這個公開 repo。secret 沒設就原樣留著，交給下面的
      # 閘門擋下來。
      - name: Restore the client-side Supabase env that `vercel pull` redacts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          file=.vercel/.env.production.local
          test -f "$file" || { echo "找不到 $file，vercel pull 沒跑成功"; exit 1; }
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::沒有設 VITE_SUPABASE_* 這兩個 GitHub secret，登入功能會是壞的"
            exit 0
          fi
          grep -v '^VITE_SUPABASE_' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          printf 'VITE_SUPABASE_URL="%s"\n' "$VITE_SUPABASE_URL" >> "$file"
          printf 'VITE_SUPABASE_PUBLISHABLE_KEY="%s"\n' "$VITE_SUPABASE_PUBLISHABLE_KEY" >> "$file"
          echo "已覆寫兩個變數（值不印出來）"

      # 這一步會執行 package.json 的 build，也就是 verify:policy → vite build →
      # prerender → validate:prerender → sitemap。任何一關沒過就紅在這裡。
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # 遮蔽字串不准上線。這種故障不會讓建置失敗、也不會讓頁面變空，只會在每個訪客的
      # console 裡丟一句錯誤、讓登入不能用，所以要有一道檢查專門偵測它。
      - name: Assert no redacted placeholder was baked into the bundle
        run: |
          if grep -rl '\[REDACTED\]' .vercel/output/static/assets/ >/dev/null 2>&1; then
            echo '建置產物裡有 "[REDACTED]"：某個 sensitive 環境變數沒有被真值覆寫。'
            echo '補法：在 GitHub secrets 設 VITE_SUPABASE_URL 與 VITE_SUPABASE_PUBLISHABLE_KEY，'
            echo '或把 Vercel 專案裡那兩個變數改成非 sensitive，讓 vercel pull 拿得到真值。'
            exit 1
          fi
          echo "產物裡沒有遮蔽字串"

      # 再確認一次「要送上去的那份」不是空殼——上一步查的是 dist/，這一步查的是
      # Vercel 實際會拿去部署的目錄。兩者理論上同源，但這是最後一道，很便宜。
      - name: Assert the artifact is not an empty shell
        run: |
          file=.vercel/output/static/index.html
          test -f "$file" || { echo "找不到 $file"; exit 1; }
          if grep -q '<div id="root"></div>' "$file"; then
            echo "$file 的根節點是空的，預先渲染沒有生效"; exit 1
          fi
          echo "$file: $(wc -c < "$file") bytes"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # 上線之後才推，順序不能反——先推等於叫 Bing 去看還沒更新的頁。
      # 這一步失敗不影響部署結果，理由寫在 scripts/indexnow.mjs 開頭。
      - name: Tell IndexNow the site changed
        run: node scripts/indexnow.mjs
